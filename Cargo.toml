[package]
name = "imagai"
version = "0.1.0"
edition = "2021"
description = "A CLI/TUI tool to generate images using various AI APIs (OpenAI, DALL-E, Stable Diffusion, Gemini, Imagen via OpenAI-compatible interfaces)."
license = "MIT"
repository = "https://github.com/chophe/imagai-cli"
readme = "README.md"

[[bin]]
name = "imagai"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "io-util", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }
axum = { version = "0.8", features = ["json", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
colored = "3"
base64 = "0.22"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
crc32fast = "1"
anyhow = "1"
ratatui = "0.30"
crossterm = "0.29"

[profile.release]
opt-level = 3
strip = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
